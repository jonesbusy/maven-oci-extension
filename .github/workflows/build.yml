name: build

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MAVEN_VERSION: 4.0.0-rc-6
  MAVEN_HOME: /opt/apache-maven-4.0.0-rc-6
  OCI_IT_MAVEN_HOME: /opt/apache-maven-4.0.0-rc-6

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o /tmp/maven.tar.gz
          tar xzf /tmp/maven.tar.gz -C /opt
          "$MAVEN_HOME/bin/mvn" -version

      - name: Maven build
        run: "$MAVEN_HOME/bin/mvn --batch-mode --update-snapshots verify"
