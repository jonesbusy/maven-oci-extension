name: build

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MAVEN_VERSION: 4.0.0-rc-6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        # Installed directly from the official Apache archive rather than a third-party setup
        # action: that action silently produced a broken environment for this pre-release version
        # (every deploy/resolve plugin failed with NoSuchMethodError on org.eclipse.aether.spi.
        # connector.Artifact{Upload,Download}.getPath(), a method that has existed since resolver
        # 2.0.0 and is genuinely present in the official 4.0.0-rc-6 distribution).
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o /tmp/maven.tar.gz
          tar xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Maven build
        run: mvn --batch-mode --update-snapshots verify
