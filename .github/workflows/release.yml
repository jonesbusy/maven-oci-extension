name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  MAVEN_VERSION: 4.0.0-rc-6
  MAVEN_HOME: /opt/apache-maven-4.0.0-rc-6

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          # Writes ~/.m2/settings.xml with a <server id="central"> block, matching the
          # publishingServerId used by central-publishing-maven-plugin's "release" profile config.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.MAVEN_VERSION }}-

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-4/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o /tmp/maven.tar.gz
          tar xzf /tmp/maven.tar.gz -C /opt
          "$MAVEN_HOME/bin/mvn" -version

      - name: Import GPG key
        # Only for artifact signing (maven-gpg-plugin, "release" profile) -- there's no git commit or
        # tag being created by this workflow, so no git-signing setup is needed.
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy release
        # CI-friendly version (https://maven.apache.org/guides/mini/guide-maven-ci-friendly.html):
        # the tag that triggered this workflow *is* the version to release, overriding the
        # 0.0.1-SNAPSHOT default from .mvn/maven.config. No release:prepare/perform -- the tag
        # already exists (it's what triggered this run), so there's no commit/tag/push left to do.
        run: "$MAVEN_HOME/bin/mvn --batch-mode -Drevision=${{ github.ref_name }} -Prelease -DskipTests deploy"
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Close release draft
        # release-drafter (see release-drafter.yml) keeps a draft release up to date as PRs merge to
        # main. There's nothing to build/attach here -- the deploy step above already published the
        # jars to Maven Central -- so all that's left is to publish that existing draft (flip draft to
        # false) now that the version it describes has actually been released. If the release was
        # instead triggered by publishing the draft directly from the GitHub UI, it won't be a draft
        # anymore by the time this runs, so there's nothing to do.
        run: |
          draft_id=$(gh api "/repos/${{ github.repository }}/releases" | jq -r '.[] | select(.draft == true) | .id')
          if [[ -z "$draft_id" ]]; then
            echo "No draft release found to close, nothing to do"
            exit 0
          fi
          echo "Closing draft release $draft_id"
          gh api -X PATCH "/repos/${{ github.repository }}/releases/$draft_id" -F draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
